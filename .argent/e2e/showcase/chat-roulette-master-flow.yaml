version: 1
steps:
  - echo: "Chat Roulette Master Showcase: End-to-End Cinematic User Journey"
  - launch: com.muhammedelnady.chatroulette
  - await: { visible: { id: chat-rooms-search-input }, timeout: 15000 }

  - tap: { id: chat-rooms-search-input }
  - tool: fill
    delayMs: 500
    args:
      text: Founders
  - tool: keyboard
    args:
      key: enter
  - await: { visible: { id: room-card-room-founders } }
  - assert: { hidden: { id: room-card-room-rn-architecture } }
  - tap: { id: chat-rooms-clear-search }
  - await: { visible: { id: room-card-room-rn-architecture } }

  - tap: { id: category-chip-TECH }
  - await: { hidden: { id: room-card-roulette-sarah } }
  - assert: { visible: { id: room-card-room-rn-architecture } }
  - tap: { id: category-chip-DESIGN }
  - await: { visible: { id: room-card-room-ui-motion } }
  - assert: { hidden: { id: room-card-room-rn-architecture } }
  - tap: { id: category-chip-ALL }
  - await: { visible: { id: room-card-room-rn-architecture } }

  - tap: { id: control-theme-toggle }
  - tap: { id: control-theme-toggle }

  - tap: { id: control-language-toggle }
  - await: { visible: { text: غرف النبض } }
  - tap: { id: control-language-toggle }
  - await: { visible: { text: Pulse Rooms } }

  - await: { visible: { id: room-card-room-rn-architecture } }
  - tap: { id: room-card-room-rn-architecture }
  - await: { visible: { id: audio-message-bubble } }
  - tap: { id: audio-speed-button }
  - await: { text: { in: { id: audio-speed-button }, contains: "Speed 1.5x" } }
  - tap: { id: audio-speed-button }
  - await: { text: { in: { id: audio-speed-button }, contains: "Speed 2x" } }
  - tap: { id: audio-play-pause-button }
  - tap: { id: audio-play-pause-button }
  - await: { visible: { text: Domain has zero outward dependencies } }
  - long-press: { text: Domain has zero outward dependencies }
  - await: { visible: { id: chat-reaction-picker } }
  - tap: { id: "chat-quick-react-🔥" }
  - await: { hidden: { id: chat-reaction-picker } }
  - assert: { visible: { id: "chat-reaction-🔥" } }
  - tap: { id: chat-header-back-button }
  - await: { visible: { id: spin-roulette-cta } }

  - tap: { id: spin-roulette-cta }
  - await: { visible: { id: roulette-start-button } }
  - tap: { id: roulette-topic-ai }
  - tap: { id: roulette-start-button }
  - await: { visible: { id: match-reveal-card }, timeout: 10000 }
  - assert: { visible: { text: Tariq Al-Mansoor } }
  - tap: { id: enter-matched-room-cta }

  - await: { visible: { id: chat-input-text } }
  - tap: { id: chat-input-text }
  - tool: fill
    delayMs: 500
    args:
      text: "E2E showcase: Clean architecture is blazing fast!"
  - await: { visible: { id: chat-send-button } }
  - tap: { id: chat-send-button }
  - await: { visible: { text: "E2E showcase: Clean architecture is blazing fast!" } }
  - await: { visible: { id: chat-faq-options-bar } }
  - scroll-to:
      target: { id: faq-chip-offlineQueue }
      direction: right
      within: { id: chat-faq-options-bar }
  - tap: { id: faq-chip-offlineQueue }
  - await:
      visible: { text: When Offline Sim is active }
      timeout: 10000
  - tap: { id: chat-header-back-button }
  - await: { visible: { id: spin-roulette-cta } }

  - tap: { id: category-chip-FOUNDERS }
  - await: { visible: { id: room-card-room-founders } }
  - tap: { id: room-card-room-founders }
  - await: { visible: { id: chat-header-network-toggle } }
  - tap: { id: chat-header-network-toggle }
  - await: { visible: { id: queue-status-banner } }
  - assert: { visible: { text: Offline Outbox Active } }
  - tap: { id: chat-input-text }
  - tool: fill
    delayMs: 500
    args:
      text: "E2E queued offline message"
  - await: { visible: { id: chat-send-button } }
  - tap: { id: chat-send-button }
  - await: { visible: { text: "E2E queued offline message" } }
  - await:
      text: { in: { id: queue-status-banner }, contains: "1 message(s) buffered in MMKV" }
  - tap: { id: chat-header-back-button }
  - await: { visible: { id: control-queue-badge } }
  - assert: { text: { in: { id: control-queue-badge }, contains: 1 queued } }
  - tap: { id: category-chip-FOUNDERS }
  - await: { visible: { id: room-card-room-founders } }
  - tap: { id: room-card-room-founders }
  - await: { visible: { id: chat-header-network-toggle } }
  - tap: { id: chat-header-network-toggle }
  - await: { hidden: { id: queue-status-banner }, timeout: 10000 }
  - await: { visible: { text: "When Offline Sim is active" }, timeout: 10000 }
  - tap: { id: chat-header-back-button }
  - await: { visible: { id: spin-roulette-cta } }
  - assert: { hidden: { id: control-queue-badge } }
