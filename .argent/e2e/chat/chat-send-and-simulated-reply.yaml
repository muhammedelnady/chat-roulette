version: 1
steps:
  - echo: Send a message in a chat room and await simulated partner reply
  - launch: com.muhammedelnady.chatroulette
  - await: { visible: { id: room-card-room-rn-architecture }, timeout: 15000 }
  - tap: { id: room-card-room-rn-architecture }
  - await: { visible: { id: chat-input-text } }
  - tap: { id: chat-input-text }
  - tool: fill
    delayMs: 500
    args:
      text: "E2E architecture hello"
  - await: { visible: { id: chat-send-button } }
  - tap: { id: chat-send-button }
  - await: { visible: { text: E2E architecture hello } }
  - await:
      visible: { text: Clean Architecture enforces strict inward dependencies }
      timeout: 10000
  - tap: { id: chat-header-back-button }
  - await: { visible: { id: spin-roulette-cta } }
