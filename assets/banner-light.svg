        <circle cx="15" cy="16" r="3.3" fill="#F59E0B" />
        <text x="68.5" y="20.2" font-size="11.5" font-weight="700" fill="#0F172A">Reanimated 4</text>
      </g>
      <g transform="translate(193.5, 0)">
        <rect x="0" y="0" width="110" height="32" rx="9" fill="url(#glass-fill-light)" stroke="url(#glass-border-light)" stroke-width="1.15" />
        <circle cx="15" cy="16" r="3.3" fill="#EC4899" />
        <text x="61.0" y="20.2" font-size="11.5" font-weight="700" fill="#0F172A">Clean Arch</text>
