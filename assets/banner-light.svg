    <rect x="1024" y="44" width="100" height="190" rx="17" fill="url(#glass-fill-light)" stroke="url(#glass-border-light)" stroke-width="1.5" filter="url(#shadow-light)" />
    <rect x="1029" y="49" width="90" height="180" rx="13" fill="#F1F5F9" opacity="0.92" />
    <rect x="1057" y="55" width="34" height="6" rx="3" fill="#0F172A" />
    <circle cx="1085" cy="58" r="1.5" fill="#7C3AED" />

    <rect x="1037" y="70" width="42" height="4.5" rx="2.2" fill="#7C3AED" opacity="0.9" />
    <rect x="1037" y="78" width="28" height="3" rx="1.5" fill="#475569" opacity="0.7" />
    <circle cx="1104" cy="74" r="5" fill="#0284C7" fill-opacity="0.28" stroke="#7C3AED" stroke-width="1" />

