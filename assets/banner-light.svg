    <polyline points="1042,175 1054,167 1066,171 1079,158 1092,162 1105,153" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="1105" cy="153" r="2.6" fill="#7C3AED" />

    <rect x="1038" y="194" width="72" height="14" rx="5" fill="#7C3AED" fill-opacity="0.22" stroke="#7C3AED" stroke-width="0.9" />
    <rect x="1058" y="199.8" width="32" height="2.6" rx="1.3" fill="#0F172A" opacity="0.85" />
