      <tspan fill="#1E293B">Offline MMKV Outbox</tspan>
      <tspan fill="#7C3AED" font-weight="700">·</tspan>
      <tspan fill="#1E293B">Voice Notes &amp; Reactions</tspan>
    </text>

    <line x1="420" y1="178" x2="780" y2="178" stroke="url(#laser-light)" stroke-width="1" opacity="0.6" />
    <circle cx="600" cy="178" r="2.3" fill="#7C3AED" />

    <g transform="translate(600, 198)" filter="url(#shadow-light)">
