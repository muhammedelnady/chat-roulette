    <circle cx="122" cy="150" r="42" fill="#7C3AED" opacity="0.07" />
    <circle cx="122" cy="150" r="64" fill="none" stroke="#0284C7" stroke-width="0.8" opacity="0.25" stroke-dasharray="5 7" />
    <g>
      <ellipse class="orb-1" cx="122" cy="150" rx="60" ry="23" fill="none" stroke="#7C3AED" stroke-width="1.7" opacity="0.85" stroke-dasharray="90 14 30 12" />
    </g>
    <g transform="rotate(60 122 150)">
      <ellipse class="orb-2" cx="122" cy="150" rx="60" ry="23" fill="none" stroke="#0284C7" stroke-width="1.5" opacity="0.72" stroke-dasharray="70 16 24 12" />
    </g>
    <g transform="rotate(120 122 150)">
      <ellipse class="orb-1" cx="122" cy="150" rx="60" ry="23" fill="none" stroke="#7C3AED" stroke-width="1.4" opacity="0.65" stroke-dasharray="80 16" />
    </g>
    <circle cx="122" cy="150" r="8.5" fill="#7C3AED" />
    <circle cx="122" cy="150" r="3.8" fill="#FFFFFF" />

    <g class="fl-a" filter="url(#shadow-light)">
      <rect x="42" y="34" width="109" height="24" rx="7" fill="url(#glass-fill-light)" stroke="url(#glass-border-light)" stroke-width="1" />
      <circle cx="55" cy="46" r="3" fill="#7C3AED" />
      <text x="65" y="49.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#1E293B">DUAL ENGINE</text>
    </g>
    <g class="fl-a" filter="url(#shadow-light)">
      <rect x="42" y="242" width="109" height="24" rx="7" fill="url(#glass-fill-light)" stroke="url(#glass-border-light)" stroke-width="1" />
      <circle cx="55" cy="254" r="3" fill="#0284C7" />
      <text x="65" y="257.5" font-family="'SF Mono', 'Fira Code', Menlo, monospace" font-size="9.5" font-weight="700" fill="#1E293B">FIFO OUTBOX</text>
    </g>
  </g>

