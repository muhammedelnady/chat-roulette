        <rect x="0" y="0" width="98" height="32" rx="9" fill="url(#glass-fill-light)" stroke="url(#glass-border-light)" stroke-width="1.15" />
        <circle cx="15" cy="16" r="3.3" fill="#38BDF8" />
        <text x="55.0" y="20.2" font-size="11.5" font-weight="700" fill="#0F172A">React 19</text>
      </g>
      <g transform="translate(-68.5, 0)">
