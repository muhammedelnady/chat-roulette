    <rect x="8" y="8" width="1184" height="284" fill="url(#aurora-b-light)" />
    <rect x="8" y="8" width="1184" height="284" fill="url(#grid-light)" />
    <g opacity="0.13" stroke="#0284C7" stroke-width="0.7">
