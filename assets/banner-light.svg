<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Chat Roulette — Instant Roulette &amp; Live Rooms">
  <defs>
    <clipPath id="card-clip-light">
      <rect x="8" y="8" width="1184" height="284" rx="18" />
    </clipPath>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="aurora-a-light" cx="16%" cy="35%" r="46%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.11" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-b-light" cx="84%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.11" />
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stroke-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="title-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#1E293B" />
      <stop offset="78%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="glass-fill-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="glass-border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="laser-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0" />
      <stop offset="25%" stop-color="#7C3AED" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#7C3AED" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7C3AED" stroke-width="0.6" stroke-opacity="0.07" />
      <circle cx="40" cy="0" r="0.9" fill="#7C3AED" fill-opacity="0.20" />
    </pattern>
    <filter id="shadow-light" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <style>
      @keyframes floatMain { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes floatAlt { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(3.5px); } }
      @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes flow { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      .fl-m { animation: floatMain 5.5s ease-in-out infinite; }
      .fl-a { animation: floatAlt 4.5s ease-in-out infinite; }
      .orb-1 { animation: spinCW 24s linear infinite; transform-origin: 122px 150px; }
      .orb-2 { animation: spinCCW 19s linear infinite; transform-origin: 122px 150px; }
      .str-1 { stroke-dasharray: 90, 310; animation: flow 6s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fl-m, .fl-a, .orb-1, .orb-2, .str-1 { animation: none !important; }
      }
    </style>
