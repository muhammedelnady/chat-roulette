      <line x1="600" y1="160" x2="365" y2="292" />
      <line x1="600" y1="160" x2="600" y2="292" />
      <line x1="600" y1="160" x2="835" y2="292" />
      <line x1="600" y1="160" x2="1070" y2="292" />
    </g>
    <g fill="none" stroke-linecap="round">
