    <circle cx="1045" cy="100" r="2" fill="#EF4444" />
    <circle cx="1052" cy="100" r="2" fill="#F59E0B" />
    <circle cx="1059" cy="100" r="2" fill="#10B981" />
    <rect x="1044" y="110" width="52" height="3.6" rx="1.8" fill="#7C3AED" opacity="0.9" />
    <rect x="1044" y="119" width="44" height="3.6" rx="1.8" fill="#0284C7" opacity="0.78" />
    <rect x="1044" y="128" width="36" height="3.6" rx="1.8" fill="#475569" opacity="0.65" />

