      <path class="str-1" d="M 0 60 Q 280 112 560 68 T 1200 54" stroke="#7C3AED" stroke-width="1.8" opacity="0.55" />
      <path d="M 0 238 Q 340 190 660 228 T 1200 202" stroke="#0284C7" stroke-width="1" opacity="0.12" />
    </g>
  </g>

  <rect x="8.75" y="8.75" width="1182.5" height="282.5" rx="18" fill="none" stroke="url(#stroke-light)" stroke-width="1.4" />
  <line x1="280" y1="9.2" x2="920" y2="9.2" stroke="url(#laser-light)" stroke-width="1.5" opacity="0.8" />

  <!-- Left Architecture Core -->
