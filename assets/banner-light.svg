        <circle cx="15" cy="16" r="3.3" fill="#10B981" />
        <text x="64.5" y="20.2" font-size="11.5" font-weight="700" fill="#0F172A">MMKV Outbox</text>
      </g>
      <g transform="translate(58.5, 0)">
